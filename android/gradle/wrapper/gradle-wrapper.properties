distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip
# NOTE: Gradle 8.13 supports up to JDK 24. If you're on JDK 25 (Major class
# version 69 error), use one of these:
#   A) Install Temurin JDK 21 via Homebrew + use it just for Android builds:
#        brew install --cask temurin@21
#        export JAVA_HOME=$(/usr/libexec/java_home -v 21)
#        ./gradlew bundleRelease
#   B) Or bump this line to gradle-9.0.2-all.zip (Groovy 4, JDK 25 support).
#      Only do that if AGP version in android/build.gradle is >= 8.7.
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
