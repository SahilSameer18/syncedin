<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f8bff"/>
      <stop offset="55%" stop-color="#3a4dff"/>
      <stop offset="100%" stop-color="#8b3dff"/>
